<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — KORSANCIM</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236366f1'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'>K</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</head>

<body class="bg-base text-ink font-sans">

    <div id="site-header"></div>

    <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">

        <!-- PROFİL KARTI -->
        <div class="card overflow-hidden">
            <div id="profile-banner" class="h-32 bg-raised bg-cover bg-center relative border-b border-line">
                <label id="btn-change-banner"
                    class="hidden absolute top-3 right-3 btn btn-ghost btn-sm cursor-pointer backdrop-blur">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i> Kapak
                    <input type="file" id="input-banner-file" accept="image/jpeg,image/png,image/gif,image/webp"
                        class="hidden" onchange="uploadImage('banner')">
                </label>
            </div>

            <div class="px-5 pb-5">
                <div class="flex items-end justify-between -mt-10 mb-4 gap-3">
                    <div class="relative">
                        <div
                            class="w-20 h-20 rounded-xl bg-sunken border-4 border-surface grid place-items-center overflow-hidden shrink-0">
                            <img id="profile-avatar" src="" alt="" class="w-full h-full object-cover">
                        </div>
                        <label id="btn-change-avatar"
                            class="hidden absolute -bottom-1 -right-1 w-7 h-7 rounded-lg bg-accent border-2 border-surface grid place-items-center cursor-pointer text-white"
                            title="Profil resmini değiştir">
                            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                            <input type="file" id="input-avatar-file" accept="image/jpeg,image/png,image/gif,image/webp"
                                class="hidden" onchange="uploadImage('avatar')">
                        </label>
                    </div>
                    <div id="profile-badge-area" class="pb-1"></div>
                </div>

                <h1 id="profile-username" class="text-xl font-bold mb-1">…</h1>
                <p id="profile-bio" class="text-[13px] text-ink-soft max-w-xl"></p>

                <div class="flex flex-wrap items-center gap-4 mt-4 pt-4 divider text-xs text-ink-faint">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        <span id="profile-joined">…</span>
                    </span>
                    <a id="profile-github" href="#" target="_blank" rel="noopener"
                        class="hidden items-center gap-1.5 hover:text-ink transition">
                        <i data-lucide="github" class="w-3.5 h-3.5"></i> GitHub
                    </a>
                    <a id="profile-web" href="#" target="_blank" rel="noopener"
                        class="hidden items-center gap-1.5 hover:text-ink transition">
                        <i data-lucide="globe" class="w-3.5 h-3.5"></i> Web sitesi
                    </a>
                </div>
            </div>
        </div>

        <!-- İSTATİSTİK -->
        <div class="grid grid-cols-2 gap-3">
            <div class="card p-4">
                <div id="stat-topics-count" class="text-xl font-bold text-ink">0</div>
                <div class="hint mt-0.5">Açılan konu</div>
            </div>
            <div class="card p-4">
                <div id="stat-comments-count" class="text-xl font-bold text-ink">0</div>
                <div class="hint mt-0.5">Yazılan yanıt</div>
            </div>
        </div>

        <!-- SEKMELER -->
        <div>
            <div class="flex items-center gap-1 border-b border-line mb-3 pb-2 overflow-x-auto">
                <button onclick="switchTab('topics')" id="tab-btn-topics" class="tab" aria-selected="true">Konular</button>
                <button onclick="switchTab('comments')" id="tab-btn-comments" class="tab"
                    aria-selected="false">Yanıtlar</button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="tab hidden ml-auto"
                    aria-selected="false">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i> Ayarlar
                </button>
            </div>

            <div id="tab-content-topics" class="space-y-2"></div>
            <div id="tab-content-comments" class="space-y-2 hidden"></div>

            <div id="tab-content-settings" class="card p-5 hidden">
                <h3 class="text-sm font-bold text-ink mb-4">Profil bilgileri</h3>
                <form id="settings-form" class="space-y-4">
                    <div>
                        <div class="flex items-baseline gap-3 mb-1.5">
                            <label class="label mb-0" for="set-bio">Biyografi</label>
                            <span id="bio-counter" class="hint ml-auto"></span>
                        </div>
                        <textarea id="set-bio" rows="3" maxlength="500" class="input"
                            placeholder="Kendinden bahset…"></textarea>
                    </div>

                    <div class="grid gap-4 sm:grid-cols-2">
                        <div>
                            <label class="label" for="set-github">GitHub</label>
                            <input type="url" id="set-github" class="input" placeholder="https://github.com/kullanici">
                        </div>
                        <div>
                            <label class="label" for="set-web">Web sitesi</label>
                            <input type="url" id="set-web" class="input" placeholder="https://site.com">
                        </div>
                    </div>

                    <div id="settings-alert" class="hidden alert"></div>

                    <div class="flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            <i data-lucide="check" class="w-4 h-4"></i> Kaydet
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto px-4 py-8 text-center">
        <p class="hint">KORSANCIM · anonim topluluk forumu</p>
    </footer>

    <script>
        let targetUser = new URLSearchParams(window.location.search).get('u');
        const myUsername = getUsername();

        if (!targetUser) targetUser = myUsername;

        const isMyProfile = myUsername && targetUser &&
            myUsername.toLowerCase() === targetUser.toLowerCase();

        async function loadProfile() {
            if (!targetUser) { window.location.href = 'auth.html'; return; }

            try {
                const res = await fetch(`/api/users/profile/${encodeURIComponent(targetUser)}`);

                if (!res.ok) {
                    document.getElementById('profile-username').textContent = 'Kullanıcı bulunamadı';
                    document.getElementById('profile-bio').textContent =
                        await readError(res, 'Böyle bir kullanıcı yok.');
                    return;
                }

                const data = await res.json();
                document.title = `${data.username} — KORSANCIM`;

                document.getElementById('profile-avatar').src = data.avatarUrl || DEFAULT_AVATAR;
                if (data.bannerUrl) {
                    document.getElementById('profile-banner').style.backgroundImage =
                        `url("${encodeURI(data.bannerUrl)}")`;
                }

                document.getElementById('profile-username').innerHTML = renderUserName(data.username);
                document.getElementById('profile-badge-area').innerHTML = renderBadge(data.username, 'md');
                document.getElementById('profile-bio').textContent = data.bio || 'Henüz biyografi eklenmemiş.';
                document.getElementById('profile-joined').textContent =
                    new Date(data.createdAt).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long' }) + ' tarihinde katıldı';

                // javascript: gibi şemaları engelle — sunucu da doğruluyor.
                const safeLink = (url) => /^https?:\/\//i.test(url || '') ? url : null;

                const github = safeLink(data.githubUrl);
                if (github) {
                    const el = document.getElementById('profile-github');
                    el.href = github;
                    el.classList.replace('hidden', 'flex');
                }

                const website = safeLink(data.websiteUrl);
                if (website) {
                    const el = document.getElementById('profile-web');
                    el.href = website;
                    el.classList.replace('hidden', 'flex');
                }

                if (isMyProfile) {
                    document.getElementById('btn-change-avatar').classList.remove('hidden');
                    document.getElementById('btn-change-banner').classList.remove('hidden');
                    document.getElementById('tab-btn-settings').classList.remove('hidden');
                    document.getElementById('set-bio').value = data.bio || '';
                    document.getElementById('set-github').value = data.githubUrl || '';
                    document.getElementById('set-web').value = data.websiteUrl || '';
                    attachCounter('set-bio', 'bio-counter', 500);
                }

                document.getElementById('stat-topics-count').textContent = data.topics?.length || 0;
                document.getElementById('stat-comments-count').textContent = data.comments?.length || 0;

                renderTopics(data.topics || []);
                renderComments(data.comments || []);

                lucide.createIcons();
            } catch (err) {
                console.error('Profil yükleme hatası:', err);
            }
        }

        function emptyCard(message) {
            return `<div class="card p-8 text-center"><p class="text-sm text-ink-soft">${escapeHtml(message)}</p></div>`;
        }

        function renderTopics(topics) {
            const container = document.getElementById('tab-content-topics');

            container.innerHTML = topics.length === 0
                ? emptyCard('Henüz konu açılmamış.')
                : topics.map(t => `
                    <a href="topic-detail.html?id=${t.id}" class="card card-hover p-4 block">
                        <div class="flex items-center gap-2 mb-1.5 text-xs">
                            <span class="chip chip-accent">${escapeHtml(t.categoryName)}</span>
                            <span class="text-ink-faint ml-auto">${escapeHtml(timeAgo(t.createdAt))}${t.updatedAt ? ' · düzenlendi' : ''}</span>
                        </div>
                        <h4 class="text-sm font-semibold text-ink mb-1">${escapeHtml(t.title)}</h4>
                        <p class="text-[13px] text-ink-soft clamp-2">${escapeHtml(t.content)}</p>
                        <div class="flex items-center gap-1 mt-2.5 pt-2.5 divider text-xs text-ink-faint">
                            <i data-lucide="heart" class="w-3 h-3"></i> ${t.likeCount}
                        </div>
                    </a>`).join('');
        }

        function renderComments(comments) {
            const container = document.getElementById('tab-content-comments');

            container.innerHTML = comments.length === 0
                ? emptyCard('Henüz yanıt yazılmamış.')
                : comments.map(c => `
                    <a href="topic-detail.html?id=${c.topicId}" class="card card-hover p-4 block">
                        <p class="text-[13px] text-ink-soft">${escapeHtml(c.content)}</p>
                        <div class="flex items-center gap-2 mt-2.5 pt-2.5 divider text-xs text-ink-faint">
                            <i data-lucide="corner-down-right" class="w-3 h-3 shrink-0"></i>
                            <span class="truncate">${escapeHtml(c.topicTitle)}</span>
                            <span class="ml-auto shrink-0">${escapeHtml(timeAgo(c.createdAt))}</span>
                        </div>
                    </a>`).join('');
        }

        function switchTab(tab) {
            ['topics', 'comments', 'settings'].forEach(name => {
                document.getElementById(`tab-content-${name}`).classList.toggle('hidden', name !== tab);
                document.getElementById(`tab-btn-${name}`).setAttribute('aria-selected', name === tab);
            });
        }

        async function uploadImage(type) {
            const input = document.getElementById(type === 'avatar' ? 'input-avatar-file' : 'input-banner-file');
            if (!input.files?.length) return;

            // Hedef kullanıcı sunucuda token'dan belirleniyor.
            const formData = new FormData();
            formData.append(type === 'avatar' ? 'avatarFile' : 'bannerFile', input.files[0]);

            try {
                const res = await apiFetch('/api/users/profile', { method: 'PUT', body: formData });
                if (res.ok) {
                    loadProfile();
                } else {
                    alert(await readError(res, 'Görsel yüklenemedi.'));
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('settings-alert');
            alertBox.classList.add('hidden');

            const formData = new FormData();
            formData.append('bio', document.getElementById('set-bio').value);
            formData.append('githubUrl', document.getElementById('set-github').value);
            formData.append('websiteUrl', document.getElementById('set-web').value);

            try {
                const res = await apiFetch('/api/users/profile', { method: 'PUT', body: formData });

                if (res.ok) {
                    alertBox.textContent = 'Profil güncellendi.';
                    alertBox.className = 'alert alert-ok';
                    loadProfile();
                } else {
                    alertBox.textContent = await readError(res, 'Profil güncellenemedi.');
                    alertBox.className = 'alert alert-bad';
                }
            } catch (err) {
                console.error(err);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderHeader({ active: isMyProfile ? 'profile' : '' });
            loadProfile();
        });
    </script>
</body>

</html>
