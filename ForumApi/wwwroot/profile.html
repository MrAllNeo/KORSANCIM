<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Profili - KORSANCIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="js/app.js"></script>
</head>

<body
    class="bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.2),rgba(255,255,255,0))] min-h-screen text-slate-100 antialiased font-sans p-4 md:p-8">

    <header
        class="max-w-4xl mx-auto bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 shadow-2xl rounded-2xl p-4 flex justify-between items-center mb-6">
        <a href="index.html" class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                K</div>
            <span
                class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">KORSANCIM</span>
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Ana Sayfa
        </a>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- PROFİL KART ÜSTÜ -->
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl overflow-hidden shadow-2xl">

            <!-- KAPAK FOTOĞRAFI (BANNER) -->
            <div id="profile-banner"
                class="h-44 bg-gradient-to-r from-indigo-900 via-slate-900 to-purple-950 relative border-b border-slate-800/80 bg-cover bg-center group/banner">
                <!-- KAPAK DEĞİŞTİR BUTONU (Sadece kendi profilinde görünür) -->
                <label id="btn-change-banner"
                    class="hidden absolute top-3 right-3 bg-slate-950/70 hover:bg-slate-900 border border-slate-700 text-xs text-slate-200 font-semibold px-3 py-1.5 rounded-xl cursor-pointer transition flex items-center gap-1.5 backdrop-blur-md shadow-lg">
                    <i data-lucide="camera" class="w-3.5 h-3.5 text-indigo-400"></i> Kapak Değiştir
                    <input type="file" id="input-banner-file" accept="image/jpeg,image/png,image/gif,image/webp" class="hidden"
                        onchange="uploadImage('banner')">
                </label>
            </div>

            <div class="px-6 pb-6 relative">
                <div class="flex justify-between items-end -mt-12 mb-4">

                    <!-- AVATAR RESMİ VE DÜZENLEME KÖŞE BUTONU -->
                    <div class="relative group/avatar">
                        <div
                            class="w-24 h-24 rounded-2xl bg-slate-950 border-4 border-slate-900 flex items-center justify-center overflow-hidden shadow-2xl shrink-0">
                            <img id="profile-avatar" src="" alt="Avatar" class="w-full h-full object-cover">
                        </div>

                        <!-- PROFİL RESMİ DEĞİŞTİR BUTONU (Sağ alt köşe) -->
                        <label id="btn-change-avatar"
                            class="hidden absolute -bottom-1 -right-1 bg-indigo-600 hover:bg-indigo-500 border-2 border-slate-900 text-white p-2 rounded-xl cursor-pointer transition shadow-lg flex items-center justify-center"
                            title="Profil Resmini Değiştir">
                            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                            <input type="file" id="input-avatar-file" accept="image/jpeg,image/png,image/gif,image/webp" class="hidden"
                                onchange="uploadImage('avatar')">
                        </label>
                    </div>

                    <div id="profile-badge-area"></div>
                </div>

                <div class="space-y-1">
                    <h1 id="profile-username" class="text-2xl font-extrabold text-white flex items-center gap-2">...
                    </h1>
                    <p id="profile-bio" class="text-xs text-slate-400 max-w-2xl leading-relaxed">Henüz bir biyografi
                        eklenmemiş.</p>
                </div>

                <div
                    class="flex flex-wrap items-center gap-4 mt-4 pt-4 border-t border-slate-800/60 text-xs text-slate-400">
                    <div class="flex items-center gap-1.5"><i data-lucide="calendar"
                            class="w-3.5 h-3.5 text-indigo-400"></i> <span id="profile-joined">...</span></div>
                    <div id="profile-github-wrap" class="hidden"><a id="profile-github" href="#" target="_blank"
                            class="flex items-center gap-1 hover:text-white transition"><i data-lucide="github"
                                class="w-3.5 h-3.5"></i> GitHub</a></div>
                    <div id="profile-web-wrap" class="hidden"><a id="profile-web" href="#" target="_blank"
                            class="flex items-center gap-1 hover:text-white transition"><i data-lucide="globe"
                                class="w-3.5 h-3.5"></i> Web Sitesi</a></div>
                </div>
            </div>
        </div>

        <!-- İSTATİSTİKLER -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center">
                    <i data-lucide="file-text" class="w-5 h-5"></i></div>
                <div>
                    <div id="stat-topics-count" class="text-lg font-bold text-white">0</div>
                    <div class="text-[11px] text-slate-500 font-medium">Açılan Konular</div>
                </div>
            </div>
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-purple500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center">
                    <i data-lucide="message-square" class="w-5 h-5"></i></div>
                <div>
                    <div id="stat-comments-count" class="text-lg font-bold text-white">0</div>
                    <div class="text-[11px] text-slate-500 font-medium">Yazılan Yanıtlar</div>
                </div>
            </div>
        </div>

        <!-- SEKMELER -->
        <div>
            <div class="flex border-b border-slate-800/80 gap-2 mb-4">
                <button onclick="switchTab('topics')" id="tab-btn-topics"
                    class="px-4 py-2 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 transition">Konuları</button>
                <button onclick="switchTab('comments')" id="tab-btn-comments"
                    class="px-4 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">Yanıtları</button>
                <button onclick="switchTab('settings')" id="tab-btn-settings"
                    class="hidden px-4 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition ml-auto flex items-center gap-1">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i> Profili & Ayarları Düzenle
                </button>
            </div>

            <div id="tab-content-topics" class="space-y-3"></div>
            <div id="tab-content-comments" class="space-y-3 hidden"></div>

            <!-- METİNSEL AYARLAR FORMU -->
            <div id="tab-content-settings" class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 hidden">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> Biyografi & Link Ayarları
                </h3>
                <form id="settings-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Biyografi</label>
                        <textarea id="set-bio" rows="3" placeholder="Kendinden bahset..."
                            class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub URL</label>
                            <input type="url" id="set-github" placeholder="https://github.com/kullaniciadi"
                                class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Web Sitesi</label>
                            <input type="url" id="set-web" placeholder="https://site.com"
                                class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                        </div>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button type="submit"
                            class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/25">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i> Bilgileri Kaydet
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const DEFAULT_AVATAR = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="%23818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

        const urlParams = new URLSearchParams(window.location.search);
        let targetUser = urlParams.get('u');

        const myUsername = getUsername();

        if (!targetUser) targetUser = myUsername;

        const isMyProfile = myUsername && targetUser && myUsername.toLowerCase() === targetUser.toLowerCase();

        async function loadProfile() {
            if (!targetUser) {
                window.location.href = 'auth.html';
                return;
            }

            try {
                const res = await fetch(`/api/users/profile/${encodeURIComponent(targetUser)}`);
                if (!res.ok) {
                    document.getElementById('profile-bio').innerText =
                        await readError(res, 'Profil yüklenemedi.');
                    return;
                }
                const data = await res.json();

                // Profil ve Kapak Fotoğrafı Yüklemesi
                document.getElementById('profile-avatar').src = data.avatarUrl || DEFAULT_AVATAR;
                if (data.bannerUrl) {
                    document.getElementById('profile-banner').style.backgroundImage = `url("${encodeURI(data.bannerUrl)}")`;
                }

                // Kendi profilimizse "Değiştir" butonlarını açalım
                if (isMyProfile) {
                    document.getElementById('btn-change-avatar').classList.remove('hidden');
                    document.getElementById('btn-change-banner').classList.remove('hidden');
                    document.getElementById('tab-btn-settings').classList.remove('hidden');
                    document.getElementById('set-bio').value = data.bio || '';
                    document.getElementById('set-github').value = data.githubUrl || '';
                    document.getElementById('set-web').value = data.websiteUrl || '';
                }

                document.getElementById('profile-username').innerHTML = renderUserName(data.username);
                document.getElementById('profile-badge-area').innerHTML = renderBadge(data.username, 'md');

                document.getElementById('profile-bio').innerText = data.bio || 'Henüz bir biyografi eklenmemiş.';
                const joinedDate = new Date(data.createdAt || Date.now()).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long' });
                document.getElementById('profile-joined').innerText = `${joinedDate} tarihinde katıldı`;

                // javascript: gibi şemaları engelle — sunucu da doğruluyor,
                // bu ikinci savunma katmanı.
                const safeLink = (url) => /^https?:\/\//i.test(url || '') ? url : null;

                const githubUrl = safeLink(data.githubUrl);
                if (githubUrl) {
                    document.getElementById('profile-github').href = githubUrl;
                    document.getElementById('profile-github-wrap').classList.remove('hidden');
                }

                const websiteUrl = safeLink(data.websiteUrl);
                if (websiteUrl) {
                    document.getElementById('profile-web').href = websiteUrl;
                    document.getElementById('profile-web-wrap').classList.remove('hidden');
                }

                document.getElementById('stat-topics-count').innerText = data.topics ? data.topics.length : 0;
                document.getElementById('stat-comments-count').innerText = data.comments ? data.comments.length : 0;

                const topicsContainer = document.getElementById('tab-content-topics');
                if (!data.topics || data.topics.length === 0) {
                    topicsContainer.innerHTML = `<div class="p-6 bg-slate-900/30 border border-slate-800/80 rounded-2xl text-xs text-slate-500 text-center">Henüz hiç konu açılmamış.</div>`;
                } else {
                    topicsContainer.innerHTML = data.topics.map(t => `
                        <a href="topic-detail.html?id=${t.id}" class="block bg-slate-900/40 border border-slate-800/80 hover:border-indigo-500/40 p-4 rounded-2xl transition">
                            <h4 class="text-sm font-bold text-slate-200 hover:text-indigo-400 transition mb-1">${escapeHtml(t.title)}</h4>
                            <p class="text-xs text-slate-400 line-clamp-1">${escapeHtml(t.content)}</p>
                        </a>`).join('');
                }

                const commentsContainer = document.getElementById('tab-content-comments');
                if (!data.comments || data.comments.length === 0) {
                    commentsContainer.innerHTML = `<div class="p-6 bg-slate-900/30 border border-slate-800/80 rounded-2xl text-xs text-slate-500 text-center">Henüz hiç yanıt yazılmamış.</div>`;
                } else {
                    commentsContainer.innerHTML = data.comments.map(c => `
                        <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-2xl space-y-1">
                            <p class="text-xs text-slate-300">${escapeHtml(c.content)}</p>
                            <a href="topic-detail.html?id=${c.topicId}" class="inline-block text-[11px] text-indigo-400 hover:underline">Konuyu Gör →</a>
                        </div>`).join('');
                }

                lucide.createIcons();
            } catch (err) { console.error(err); }
        }

        // FOTOĞRAF ANINDA YÜKLEME FONKSİYONU
        async function uploadImage(type) {
            const input = document.getElementById(type === 'avatar' ? 'input-avatar-file' : 'input-banner-file');
            if (!input.files || !input.files[0]) return;

            // Hedef kullanıcı sunucuda token'dan belirleniyor.
            const formData = new FormData();
            formData.append(type === 'avatar' ? 'avatarFile' : 'bannerFile', input.files[0]);

            try {
                const res = await apiFetch('/api/users/profile', {
                    method: 'PUT',
                    body: formData
                });

                if (res.ok) {
                    loadProfile(); // Anında resmi sayfada güncelle
                } else {
                    alert(await readError(res, 'Görsel yüklenemedi.'));
                }
            } catch (err) { console.error(err); }
        }

        function switchTab(tab) {
            document.getElementById('tab-content-topics').classList.add('hidden');
            document.getElementById('tab-content-comments').classList.add('hidden');
            document.getElementById('tab-content-settings').classList.add('hidden');

            document.getElementById('tab-btn-topics').className = 'px-4 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition';
            document.getElementById('tab-btn-comments').className = 'px-4 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition';
            document.getElementById('tab-btn-settings').className = 'px-4 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition ml-auto flex items-center gap-1';

            if (tab === 'topics') {
                document.getElementById('tab-content-topics').classList.remove('hidden');
                document.getElementById('tab-btn-topics').className = 'px-4 py-2 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 transition';
            } else if (tab === 'comments') {
                document.getElementById('tab-content-comments').classList.remove('hidden');
                document.getElementById('tab-btn-comments').className = 'px-4 py-2 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 transition';
            } else if (tab === 'settings') {
                document.getElementById('tab-content-settings').classList.remove('hidden');
                document.getElementById('tab-btn-settings').className = 'px-4 py-2 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 transition ml-auto flex items-center gap-1';
            }
        }

        // BİYOGRAFİ VE LİNK GÜNCELLEME
        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('bio', document.getElementById('set-bio').value);
            formData.append('githubUrl', document.getElementById('set-github').value);
            formData.append('websiteUrl', document.getElementById('set-web').value);

            try {
                const res = await apiFetch('/api/users/profile', {
                    method: 'PUT',
                    body: formData
                });

                if (res.ok) {
                    alert('Profil bilgilerin güncellendi!');
                    loadProfile();
                    switchTab('topics');
                } else {
                    alert(await readError(res, 'Profil güncellenemedi.'));
                }
            } catch (err) { console.error(err); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderUserNav();
            loadProfile();
        });
    </script>
</body>

</html>
