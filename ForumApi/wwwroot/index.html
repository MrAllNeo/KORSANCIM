<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORSANCIM - Anonim Topluluk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="js/app.js"></script>
</head>

<body
    class="bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.2),rgba(255,255,255,0))] min-h-screen text-slate-100 antialiased font-sans p-4 md:p-8">

    <header
        class="max-w-4xl mx-auto bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 shadow-2xl rounded-2xl p-4 flex justify-between items-center mb-6">
        <a href="index.html" class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                K</div>
            <span
                class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">KORSANCIM</span>
        </a>

        <div class="flex items-center gap-3">
            <a href="create-topic.html"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/25 flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> Yeni Konu
            </a>

            <!-- Dinamik Kullanıcı / Giriş Alanı -->
            <div id="user-nav-area"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <!-- ARAMA ÇUBUĞU -->
        <div class="mb-4 relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <input type="text" id="search-input" autocomplete="off"
                placeholder="Konularda, yanıtlarda ve kullanıcılarda ara..."
                class="w-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl pl-10 pr-10 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition shadow-xl">
            <button id="search-clear" onclick="clearSearch()" title="Aramayı temizle"
                class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-200 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- KATEGORİ FİLTRELEME BUTONLARI -->
        <div id="category-bar" class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterCategory(0, this)"
                class="cat-btn active-cat bg-indigo-600 text-white border border-indigo-500 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                <i data-lucide="layers" class="w-3.5 h-3.5"></i> Tüm Konular
            </button>
            <button onclick="filterCategory(1, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="code" class="w-3.5 h-3.5 text-indigo-400"></i> Yazılım & Kodlama
            </button>
            <button onclick="filterCategory(2, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i> Donanım & Sistem
            </button>
            <button onclick="filterCategory(3, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="coffee" class="w-3.5 h-3.5 text-indigo-400"></i> Geyik & Sohbet
            </button>
        </div>

        <!-- KONULAR LİSTESİ -->
        <div id="topic-list" class="space-y-4">
            <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                <p class="text-slate-400 text-xs animate-pulse">Konular yükleniyor...</p>
            </div>
        </div>

        <!-- ARAMA SONUÇLARI (arama yapılınca konu listesinin yerini alır) -->
        <div id="search-results" class="hidden space-y-6"></div>
    </main>

    <script>
        lucide.createIcons();

        let currentCategoryId = 0;
        const categoryNames = {
            1: 'Yazılım & Kodlama',
            2: 'Donanım & Sistem',
            3: 'Geyik & Sohbet'
        };

        // Konuları API'den Çekme
        async function fetchTopics(categoryId = 0) {
            const topicListContainer = document.getElementById('topic-list');
            topicListContainer.innerHTML = `
            <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                <p class="text-slate-400 text-xs animate-pulse">Konular getiriliyor...</p>
            </div>`;

            try {
                let url = '/api/topics';
                if (categoryId > 0) {
                    url += `?categoryId=${categoryId}`;
                }

                const response = await fetch(url);
                const topics = await response.json();

                if (!topics || topics.length === 0) {
                    topicListContainer.innerHTML = `
                    <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                        <p class="text-slate-400 text-sm">Bu kategoride henüz hiç konu açılmamış.</p>
                    </div>`;
                    return;
                }

                topicListContainer.innerHTML = topics.map(topic => {
                    const hasFiles = topic.fileUrls && topic.fileUrls.length > 0;
                    const fileBadge = hasFiles
                        ? `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-full">
                            <i data-lucide="paperclip" class="w-3 h-3"></i> ${topic.fileUrls.length} Ek
                           </span>`
                        : '';

                    const categoryName = categoryNames[topic.categoryId] || `Kategori #${topic.categoryId}`;

                    const formattedDate = formatDate(topic.createdAt);
                    const authorName = topic.authorUsername || 'Anonim';
                    const safeTitle = escapeHtml(topic.title);
                    const safeContent = escapeHtml(topic.content);

                    return `
                    <article class="bg-slate-900/50 backdrop-blur-xl border border-slate-800/80 hover:border-slate-700/80 transition rounded-2xl p-5 shadow-lg group">
                        <div class="flex items-start justify-between gap-4 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
                                    ${categoryName}
                                </span>
                                ${fileBadge}
                            </div>
                            <span class="text-xs text-slate-500">${formattedDate}</span>
                        </div>

                        <a href="topic-detail.html?id=${topic.id}" class="block">
                            <h2 class="text-base font-bold text-slate-100 group-hover:text-indigo-400 transition mb-2">
                                ${safeTitle}
                            </h2>
                            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-4">
                                ${safeContent}
                            </p>
                        </a>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/60 text-xs text-slate-400">
                            <!-- TIKLANABİLİR YAZAR PROFİL LİNKİ -->
                            <a href="profile.html?u=${escapeAttr(authorName)}" class="flex items-center gap-2 hover:text-indigo-400 transition group/user">
                                <div class="w-6 h-6 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-[10px] font-bold text-indigo-400 group-hover/user:scale-110 transition">
                                    ${escapeHtml(authorName.charAt(0).toUpperCase())}
                                </div>
                                ${renderUserName(authorName, 'text-xs')}
                                ${renderBadge(authorName)}
                            </a>

                            <div class="flex items-center gap-3">
                                <!-- LIKE BUTONU -->
                                <button onclick="likeTopic(${topic.id}, this)" class="flex items-center gap-1 hover:text-rose-400 transition bg-slate-950/40 border border-slate-800 hover:border-rose-500/30 px-2.5 py-1 rounded-lg">
                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-500"></i>
                                    <span class="like-count font-semibold">${topic.likeCount || 0}</span>
                                </button>

                                <a href="topic-detail.html?id=${topic.id}" class="flex items-center gap-1 hover:text-white transition bg-indigo-600/10 border border-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-lg">
                                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i> Yanıtla
                                </a>
                            </div>
                        </div>
                    </article>
                    `;
                }).join('');

                lucide.createIcons();

            } catch (error) {
                console.error('Hata:', error);
            }
        }

        async function likeTopic(topicId, btnElement) {
            if (!isLoggedIn()) {
                window.location.href = 'auth.html';
                return;
            }

            try {
                const res = await apiFetch(`/api/topics/${topicId}/like`, { method: 'POST' });

                if (res.ok) {
                    const data = await res.json();
                    const countSpan = btnElement.querySelector('.like-count');
                    if (countSpan) countSpan.innerText = data.likes;

                    // Eğer beğendiyse kırmızı yap, beğeniyi geri aldıysa eski haline getir
                    if (data.isLiked) {
                        btnElement.classList.add('text-rose-400', 'border-rose-500/50');
                    } else {
                        btnElement.classList.remove('text-rose-400', 'border-rose-500/50');
                    }
                }
            } catch (err) {
                console.error('Like Hatası:', err);
            }
        }        // ── ARAMA ───────────────────────────────────────────────
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const topicList = document.getElementById('topic-list');
        const categoryBar = document.getElementById('category-bar');
        const searchClear = document.getElementById('search-clear');

        let searchTimer = null;
        let searchSeq = 0; // geç dönen eski isteğin yenisini ezmesini önler

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(runSearch, 250);
        });

        function clearSearch() {
            searchInput.value = '';
            runSearch();
            searchInput.focus();
        }

        function showBrowseMode() {
            searchResults.classList.add('hidden');
            searchResults.innerHTML = '';
            topicList.classList.remove('hidden');
            categoryBar.classList.remove('hidden');
            searchClear.classList.add('hidden');
        }

        function showSearchMode() {
            topicList.classList.add('hidden');
            categoryBar.classList.add('hidden');
            searchResults.classList.remove('hidden');
            searchClear.classList.remove('hidden');
        }

        async function runSearch() {
            const query = searchInput.value.trim();

            if (query.length === 0) {
                showBrowseMode();
                return;
            }

            showSearchMode();

            if (query.length < 2) {
                searchResults.innerHTML = emptyBox('Aramak için en az 2 karakter yazın.');
                return;
            }

            const seq = ++searchSeq;
            searchResults.innerHTML = emptyBox('Aranıyor...', true);

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=20`);
                if (seq !== searchSeq) return; // daha yeni bir arama başladı

                if (!res.ok) {
                    searchResults.innerHTML = emptyBox(await readError(res, 'Arama yapılamadı.'));
                    return;
                }

                renderSearchResults(await res.json());
            } catch (err) {
                if (seq !== searchSeq) return;
                console.error('Arama hatası:', err);
                searchResults.innerHTML = emptyBox('Sunucuya bağlanılamadı.');
            }
        }

        function emptyBox(message, pulse = false) {
            return `<div class="text-center py-10 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                        <p class="text-slate-400 text-xs ${pulse ? 'animate-pulse' : ''}">${escapeHtml(message)}</p>
                    </div>`;
        }

        function sectionHeader(icon, title, count) {
            return `<div class="flex items-center gap-2 mb-3">
                        <i data-lucide="${icon}" class="w-4 h-4 text-indigo-400"></i>
                        <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wide">${title}</h3>
                        <span class="text-[10px] font-bold text-indigo-300 bg-indigo-500/15 border border-indigo-500/25 px-2 py-0.5 rounded-full">${count}</span>
                    </div>`;
        }

        function renderSearchResults(data) {
            const q = data.query;
            const total = data.totals.topics + data.totals.comments + data.totals.users;

            if (total === 0) {
                searchResults.innerHTML = emptyBox(`"${q}" için sonuç bulunamadı.`);
                return;
            }

            let html = `<p class="text-[11px] text-slate-500">
                            <strong class="text-slate-300">${escapeHtml(q)}</strong> için ${total} sonuç
                        </p>`;

            // ── Kullanıcılar ──
            if (data.users.length > 0) {
                html += `<section>${sectionHeader('users', 'Kullanıcılar', data.totals.users)}
                    <div class="grid gap-2 sm:grid-cols-2">` +
                    data.users.map(u => `
                        <a href="profile.html?u=${escapeAttr(u.username)}"
                           class="flex items-center gap-3 bg-slate-900/50 border border-slate-800/80 hover:border-indigo-500/40 rounded-2xl p-3 transition">
                            <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center overflow-hidden shrink-0">
                                ${u.avatarUrl
                            ? `<img src="${escapeHtml(u.avatarUrl)}" class="w-full h-full object-cover">`
                            : `<span class="text-xs font-bold text-indigo-300">${escapeHtml(u.username.charAt(0).toUpperCase())}</span>`}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    ${renderUserName(u.username, 'text-xs')}
                                    ${renderBadge(u.username)}
                                </div>
                                <p class="text-[11px] text-slate-500 truncate">${highlight(truncate(u.bio || 'Biyografi yok.', 60), q)}</p>
                            </div>
                        </a>`).join('') + `</div></section>`;
            }

            // ── Konular ──
            if (data.topics.length > 0) {
                html += `<section>${sectionHeader('file-text', 'Konular', data.totals.topics)}
                    <div class="space-y-2">` +
                    data.topics.map(t => `
                        <a href="topic-detail.html?id=${t.id}"
                           class="block bg-slate-900/50 border border-slate-800/80 hover:border-indigo-500/40 rounded-2xl p-4 transition">
                            <div class="flex items-center justify-between gap-3 mb-1.5">
                                <span class="text-[10px] font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-md">
                                    ${escapeHtml(categoryNames[t.categoryId] || 'Kategori #' + t.categoryId)}
                                </span>
                                <span class="text-[10px] text-slate-500">${formatDate(t.createdAt)}</span>
                            </div>
                            <h4 class="text-sm font-bold text-slate-100 mb-1">${highlight(t.title, q)}</h4>
                            <p class="text-[11px] text-slate-400 leading-relaxed">${highlight(truncate(t.content, 180), q)}</p>
                            <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-800/60">
                                ${renderUserName(t.authorUsername, 'text-[11px]')}
                                ${renderBadge(t.authorUsername)}
                                <span class="ml-auto text-[10px] text-slate-500 flex items-center gap-1">
                                    <i data-lucide="heart" class="w-3 h-3 text-rose-500"></i> ${t.likeCount}
                                </span>
                            </div>
                        </a>`).join('') + `</div></section>`;
            }

            // ── Yanıtlar ──
            if (data.comments.length > 0) {
                html += `<section>${sectionHeader('message-square', 'Yanıtlar', data.totals.comments)}
                    <div class="space-y-2">` +
                    data.comments.map(c => `
                        <a href="topic-detail.html?id=${c.topicId}"
                           class="block bg-slate-900/50 border border-slate-800/80 hover:border-indigo-500/40 rounded-2xl p-4 transition">
                            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                                ${renderUserName(c.authorUsername, 'text-[11px]')}
                                ${renderBadge(c.authorUsername)}
                                <span class="ml-auto text-[10px] text-slate-500">${formatDate(c.createdAt)}</span>
                            </div>
                            <p class="text-[11px] text-slate-300 leading-relaxed">${highlight(truncate(c.content, 180), q)}</p>
                            <p class="text-[10px] text-slate-500 mt-2 pt-2 border-t border-slate-800/60 flex items-center gap-1">
                                <i data-lucide="corner-down-right" class="w-3 h-3"></i>
                                ${escapeHtml(c.topicTitle)}
                            </p>
                        </a>`).join('') + `</div></section>`;
            }

            searchResults.innerHTML = html;
            lucide.createIcons();
        }

        function formatDate(value) {
            return new Date(value).toLocaleDateString('tr-TR', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
            });
        }

        function filterCategory(catId, btnElement) {
            currentCategoryId = catId;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5';
            });
            btnElement.className = 'cat-btn bg-indigo-600 text-white border border-indigo-500 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20';
            fetchTopics(catId);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderUserNav();
            fetchTopics(0);

            // index.html?q=... ile gelen aramayı otomatik çalıştır (paylaşılabilir link).
            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery) {
                searchInput.value = initialQuery;
                runSearch();
            }
        });
    </script>
</body>

</html>
