<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForum - Anonim Topluluk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.2),rgba(255,255,255,0))] min-h-screen text-slate-100 antialiased font-sans p-4 md:p-8">

    <header
        class="max-w-4xl mx-auto bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 shadow-2xl rounded-2xl p-4 flex justify-between items-center mb-6">
        <a href="index.html" class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                F</div>
            <span
                class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">DevForum</span>
        </a>

        <div class="flex items-center gap-3">
            <a href="create-topic.html"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/25 flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> Yeni Konu
            </a>

            <!-- Dinamik Kullanıcı / Giriş Alanı -->
            <div id="user-nav-area"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <!-- ARAMA ÇUBUĞU -->
        <div class="mb-4 relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <input type="text" id="search-input" onkeyup="searchTopics()"
                placeholder="Konu başlığında, içeriğinde veya yazarda ara..."
                class="w-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl pl-10 pr-4 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition shadow-xl">
        </div>

        <!-- KATEGORİ FİLTRELEME BUTONLARI -->
        <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterCategory(0, this)"
                class="cat-btn active-cat bg-indigo-600 text-white border border-indigo-500 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                <i data-lucide="layers" class="w-3.5 h-3.5"></i> Tüm Konular
            </button>
            <button onclick="filterCategory(1, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="code" class="w-3.5 h-3.5 text-indigo-400"></i> Yazılım & Kodlama
            </button>
            <button onclick="filterCategory(2, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i> Donanım & Sistem
            </button>
            <button onclick="filterCategory(3, this)"
                class="cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5">
                <i data-lucide="coffee" class="w-3.5 h-3.5 text-indigo-400"></i> Geyik & Sohbet
            </button>
        </div>

        <!-- KONULAR LİSTESİ -->
        <div id="topic-list" class="space-y-4">
            <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                <p class="text-slate-400 text-xs animate-pulse">Konular yükleniyor...</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        let currentCategoryId = 0;
        const categoryNames = {
            1: 'Yazılım & Kodlama',
            2: 'Donanım & Sistem',
            3: 'Geyik & Sohbet'
        };

        // Konuları API'den Çekme
        async function fetchTopics(categoryId = 0) {
            const topicListContainer = document.getElementById('topic-list');
            topicListContainer.innerHTML = `
            <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                <p class="text-slate-400 text-xs animate-pulse">Konular getiriliyor...</p>
            </div>`;

            try {
                let url = '/api/topics';
                if (categoryId > 0) {
                    url += `?categoryId=${categoryId}`;
                }

                const response = await fetch(url);
                const topics = await response.json();

                if (!topics || topics.length === 0) {
                    topicListContainer.innerHTML = `
                    <div class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                        <p class="text-slate-400 text-sm">Bu kategoride henüz hiç konu açılmamış.</p>
                    </div>`;
                    return;
                }

                topicListContainer.innerHTML = topics.map(topic => {
                    const hasFiles = topic.fileUrls && topic.fileUrls.length > 0;
                    const fileBadge = hasFiles
                        ? `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-full">
                            <i data-lucide="paperclip" class="w-3 h-3"></i> ${topic.fileUrls.length} Ek
                           </span>`
                        : '';

                    const categoryName = categoryNames[topic.categoryId] || `Kategori #${topic.categoryId}`;

                    const formattedDate = new Date(topic.createdAt).toLocaleDateString('tr-TR', {
                        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                    });

                    const authorName = topic.authorUsername || 'Anonim';

                    return `
                    <article class="bg-slate-900/50 backdrop-blur-xl border border-slate-800/80 hover:border-slate-700/80 transition rounded-2xl p-5 shadow-lg group">
                        <div class="flex items-start justify-between gap-4 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
                                    ${categoryName}
                                </span>
                                ${fileBadge}
                            </div>
                            <span class="text-xs text-slate-500">${formattedDate}</span>
                        </div>

                        <a href="topic-detail.html?id=${topic.id}" class="block">
                            <h2 class="text-base font-bold text-slate-100 group-hover:text-indigo-400 transition mb-2">
                                ${topic.title}
                            </h2>
                            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-4">
                                ${topic.content}
                            </p>
                        </a>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/60 text-xs text-slate-400">
                            <!-- TIKLANABİLİR YAZAR PROFİL LİNKİ -->
                            <a href="profile.html?u=${authorName}" class="flex items-center gap-2 hover:text-indigo-400 transition group/user">
                                <div class="w-6 h-6 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-[10px] font-bold text-indigo-400 group-hover/user:scale-110 transition">
                                    ${authorName.charAt(0).toUpperCase()}
                                </div>
                                <span class="font-medium text-slate-300 group-hover/user:text-indigo-400 transition">${authorName}</span>
                            </a>

                            <div class="flex items-center gap-3">
                                <!-- LIKE BUTONU -->
                                <button onclick="likeTopic(${topic.id}, this)" class="flex items-center gap-1 hover:text-rose-400 transition bg-slate-950/40 border border-slate-800 hover:border-rose-500/30 px-2.5 py-1 rounded-lg">
                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-500"></i>
                                    <span class="like-count font-semibold">${topic.likeCount || 0}</span>
                                </button>

                                <a href="topic-detail.html?id=${topic.id}" class="flex items-center gap-1 hover:text-white transition bg-indigo-600/10 border border-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-lg">
                                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i> Yanıtla
                                </a>
                            </div>
                        </div>
                    </article>
                    `;
                }).join('');

                lucide.createIcons();

            } catch (error) {
                console.error('Hata:', error);
            }
        }

        async function likeTopic(topicId, btnElement) {
            const storedUser = localStorage.getItem('currentUser');
            const username = storedUser ? JSON.parse(storedUser).username : 'Anonim';

            try {
                const res = await fetch(`/api/topics/${topicId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                if (res.ok) {
                    const data = await res.json();
                    const countSpan = btnElement.querySelector('.like-count');
                    if (countSpan) countSpan.innerText = data.likes;

                    // Eğer beğendiyse kırmızı yap, beğeniyi geri aldıysa eski haline getir
                    if (data.isLiked) {
                        btnElement.classList.add('text-rose-400', 'border-rose-500/50');
                    } else {
                        btnElement.classList.remove('text-rose-400', 'border-rose-500/50');
                    }
                }
            } catch (err) {
                console.error('Like Hatası:', err);
            }
        }        // Canlı Arama Fonksiyonu
        function searchTopics() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const topicCards = document.querySelectorAll('#topic-list article');

            topicCards.forEach(card => {
                const title = card.querySelector('h2') ? card.querySelector('h2').innerText.toLowerCase() : '';
                const content = card.querySelector('p') ? card.querySelector('p').innerText.toLowerCase() : '';
                const author = card.querySelector('span.font-medium') ? card.querySelector('span.font-medium').innerText.toLowerCase() : '';

                if (title.includes(query) || content.includes(query) || author.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterCategory(catId, btnElement) {
            currentCategoryId = catId;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn bg-slate-900/60 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5';
            });
            btnElement.className = 'cat-btn bg-indigo-600 text-white border border-indigo-500 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20';
            fetchTopics(catId);
        }

        function checkUserSession() {
            const userNav = document.getElementById('user-nav-area');
            if (!userNav) return;

            const storedUser = localStorage.getItem('currentUser');

            if (storedUser) {
                const user = JSON.parse(storedUser);
                userNav.innerHTML = `
                    <div class="flex items-center gap-3 bg-slate-950/80 border border-slate-800/80 pl-2 pr-3 py-1.5 rounded-xl text-xs">
                        <a href="profile.html?u=${user.username}" class="flex items-center gap-2 hover:text-indigo-400 transition group cursor-pointer">
                            <div class="w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center shrink-0 group-hover:border-indigo-500/50">
                                <i data-lucide="user" class="w-4 h-4 text-indigo-400"></i>
                            </div>
                            <span class="text-slate-200 font-semibold group-hover:text-indigo-400 transition">${user.username}</span>
                        </a>
                        <button onclick="logout()" title="Çıkış Yap" class="text-slate-500 hover:text-rose-400 transition ml-1 p-1">
                            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            } else {
                userNav.innerHTML = `
                    <a href="auth.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-slate-700">
                        <i data-lucide="user" class="w-4 h-4"></i> Giriş Yap / Kayıt
                    </a>
                `;
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkUserSession();
            fetchTopics(0);
        });
    </script>
</body>

</html>
