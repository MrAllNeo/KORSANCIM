<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORSANCIM — Anonim Topluluk</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</head>

<body class="bg-base text-ink font-sans">

    <div id="site-header"></div>

    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- ARAMA -->
        <div class="relative mb-4">
            <i data-lucide="search"
                class="w-4 h-4 text-ink-faint absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="search-input" autocomplete="off"
                placeholder="Konularda, yanıtlarda ve kullanıcılarda ara…" class="input pl-10 pr-10">
            <button id="search-clear" onclick="clearSearch()" title="Aramayı temizle"
                class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-ink-faint hover:text-ink transition p-1.5">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- KATEGORİ SEKMELERİ -->
        <div id="category-bar" role="tablist" aria-label="Kategoriler"
            class="flex items-center gap-1 overflow-x-auto pb-3 mb-4 -mx-1 px-1">
        </div>

        <!-- KONU LİSTESİ -->
        <div id="topic-list" class="space-y-2"></div>

        <!-- ARAMA SONUÇLARI -->
        <div id="search-results" class="hidden space-y-6"></div>

    </main>

    <footer class="max-w-3xl mx-auto px-4 py-8 text-center">
        <p class="hint">KORSANCIM · anonim topluluk forumu</p>
    </footer>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchClear = document.getElementById('search-clear');
        const topicList = document.getElementById('topic-list');
        const categoryBar = document.getElementById('category-bar');

        let currentCategoryId = 0;
        let currentPage = 1;
        let hasMorePages = false;
        let likedTopicIds = new Set();

        // ── Kategori sekmeleri (API'den) ────────────────────────
        async function renderCategoryBar() {
            const categories = await getCategories();

            const tab = (id, label, count) => `
                <button role="tab" aria-selected="${currentCategoryId === id}"
                        onclick="filterCategory(${id})" class="tab">
                    ${escapeHtml(label)}${count !== null ? `<span class="text-ink-faint ml-1.5">${count}</span>` : ''}
                </button>`;

            const total = categories.reduce((sum, c) => sum + c.topicCount, 0);

            categoryBar.innerHTML =
                tab(0, 'Tümü', total) +
                categories.map(c => tab(c.id, c.name, c.topicCount)).join('');
        }

        function filterCategory(id) {
            currentCategoryId = id;
            renderCategoryBar();
            fetchTopics(id, 1, false);
        }

        // ── Konu listesi ────────────────────────────────────────
        function skeletonList(n = 5) {
            return Array.from({ length: n }, () => `
                <div class="card p-4 space-y-3">
                    <div class="skeleton h-3 w-24"></div>
                    <div class="skeleton h-4 w-3/4"></div>
                    <div class="skeleton h-3 w-full"></div>
                </div>`).join('');
        }

        async function fetchTopics(categoryId = 0, page = 1, append = false) {
            if (!append) {
                currentPage = 1;
                topicList.innerHTML = skeletonList();
            }

            try {
                const params = new URLSearchParams({ page, pageSize: 20 });
                if (categoryId > 0) params.set('categoryId', categoryId);

                // apiFetch kullanıyoruz: girişliysek token gider ve sunucu
                // her konu için likedByMe alanını da doldurur (tek sorgu).
                const response = await apiFetch(`/api/topics?${params}`);
                const data = await response.json();

                const topics = data.items || [];
                currentPage = data.page;
                hasMorePages = data.hasMore;

                topics.forEach(t => t.likedByMe ? likedTopicIds.add(t.id) : likedTopicIds.delete(t.id));

                if (topics.length === 0 && !append) {
                    topicList.innerHTML = `
                        <div class="card p-10 text-center">
                            <i data-lucide="inbox" class="w-8 h-8 text-ink-faint mx-auto mb-3"></i>
                            <p class="text-sm text-ink-soft">Bu kategoride henüz konu yok.</p>
                            <a href="create-topic.html" class="btn btn-ghost btn-sm mt-4">İlk konuyu sen aç</a>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                const html = topics.map(renderTopicCard).join('');
                document.getElementById('load-more-wrap')?.remove();

                if (append) {
                    topicList.insertAdjacentHTML('beforeend', html);
                } else {
                    topicList.innerHTML = html;
                }

                if (hasMorePages) {
                    const remaining = data.total - currentPage * data.pageSize;
                    topicList.insertAdjacentHTML('beforeend', `
                        <div id="load-more-wrap" class="pt-3 text-center">
                            <button id="load-more-btn" onclick="loadMoreTopics()" class="btn btn-ghost">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                Daha fazla <span class="text-ink-faint">(${remaining})</span>
                            </button>
                        </div>`);
                }

                lucide.createIcons();
            } catch (error) {
                console.error('Konular yüklenemedi:', error);
                topicList.innerHTML = `<div class="alert alert-bad">Konular yüklenemedi. Sunucu çalışıyor mu?</div>`;
            }
        }

        function renderTopicCard(topic) {
            const author = topic.authorUsername;
            const liked = likedTopicIds.has(topic.id);
            const attachment = topic.fileUrls?.length
                ? `<span class="chip"><i data-lucide="paperclip" class="w-3 h-3"></i>${topic.fileUrls.length}</span>`
                : '';

            return `
            <article class="card card-hover p-4">
                <div class="flex items-center gap-2 mb-2 text-xs">
                    <span class="chip chip-accent">${escapeHtml(topic.categoryName || categoryName(topic.categoryId))}</span>
                    ${attachment}
                    <span class="text-ink-faint ml-auto" title="${escapeHtml(formatDate(topic.createdAt))}">
                        ${escapeHtml(timeAgo(topic.createdAt))}${topic.updatedAt ? ' · düzenlendi' : ''}
                    </span>
                </div>

                <a href="topic-detail.html?id=${topic.id}" class="block group">
                    <h2 class="text-[15px] font-semibold text-ink group-hover:text-accent-soft transition mb-1.5">
                        ${escapeHtml(topic.title)}
                    </h2>
                    <p class="text-[13px] text-ink-soft clamp-2">${escapeHtml(stripRichSyntax(topic.content))}</p>
                </a>

                <div class="flex items-center gap-2 mt-3 pt-3 divider text-xs flex-wrap">
                    <a href="profile.html?u=${escapeAttr(author)}" class="flex items-center gap-1.5 hover:opacity-80 transition">
                        ${renderUserName(author, 'text-[13px]')}
                    </a>
                    ${renderBadge(author)}

                    <div class="flex items-center gap-1 ml-auto">
                        <button onclick="likeTopic(${topic.id}, this)"
                            class="btn btn-quiet btn-sm ${liked ? 'text-bad' : ''}" aria-pressed="${liked}">
                            <i data-lucide="heart" class="w-3.5 h-3.5" ${liked ? 'fill="currentColor"' : ''}></i>
                            <span class="like-count">${topic.likeCount || 0}</span>
                        </button>
                        <a href="topic-detail.html?id=${topic.id}" class="btn btn-quiet btn-sm">
                            <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                            ${topic.commentCount || 0}
                        </a>
                    </div>
                </div>
            </article>`;
        }

        async function loadMoreTopics() {
            const btn = document.getElementById('load-more-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Yükleniyor…`;
                lucide.createIcons();
            }
            await fetchTopics(currentCategoryId, currentPage + 1, true);
        }

        async function likeTopic(topicId, btn) {
            if (!isLoggedIn()) { window.location.href = 'auth.html'; return; }

            try {
                const res = await apiFetch(`/api/topics/${topicId}/like`, { method: 'POST' });
                if (!res.ok) return;

                const data = await res.json();
                btn.querySelector('.like-count').textContent = data.likes;
                btn.classList.toggle('text-bad', data.isLiked);
                btn.setAttribute('aria-pressed', data.isLiked);

                const icon = btn.querySelector('[data-lucide], svg');
                if (data.isLiked) { likedTopicIds.add(topicId); } else { likedTopicIds.delete(topicId); }
                if (icon) icon.setAttribute('fill', data.isLiked ? 'currentColor' : 'none');
            } catch (err) {
                console.error('Beğeni hatası:', err);
            }
        }

        // ── Arama ───────────────────────────────────────────────
        let searchTimer = null;
        let searchSeq = 0;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(runSearch, 250);
        });

        function clearSearch() {
            searchInput.value = '';
            runSearch();
            searchInput.focus();
        }

        function showBrowseMode() {
            searchResults.classList.add('hidden');
            searchResults.innerHTML = '';
            topicList.classList.remove('hidden');
            categoryBar.classList.remove('hidden');
            searchClear.classList.add('hidden');
        }

        function showSearchMode() {
            topicList.classList.add('hidden');
            categoryBar.classList.add('hidden');
            searchResults.classList.remove('hidden');
            searchClear.classList.remove('hidden');
        }

        async function runSearch() {
            const query = searchInput.value.trim();

            if (query.length === 0) { showBrowseMode(); return; }
            showSearchMode();

            if (query.length < 2) {
                searchResults.innerHTML = noticeBox('Aramak için en az 2 karakter yazın.');
                return;
            }

            const seq = ++searchSeq;
            searchResults.innerHTML = skeletonList(3);

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=20`);
                if (seq !== searchSeq) return;

                if (!res.ok) {
                    searchResults.innerHTML = noticeBox(await readError(res, 'Arama yapılamadı.'));
                    return;
                }
                renderSearchResults(await res.json());
            } catch (err) {
                if (seq !== searchSeq) return;
                console.error('Arama hatası:', err);
                searchResults.innerHTML = noticeBox('Sunucuya bağlanılamadı.');
            }
        }

        function noticeBox(message) {
            return `<div class="card p-8 text-center"><p class="text-sm text-ink-soft">${escapeHtml(message)}</p></div>`;
        }

        function sectionHeader(icon, title, count) {
            return `<div class="flex items-center gap-2 mb-2.5">
                        <i data-lucide="${icon}" class="w-4 h-4 text-ink-faint"></i>
                        <h3 class="text-xs font-bold text-ink-soft uppercase tracking-wider">${title}</h3>
                        <span class="chip">${count}</span>
                    </div>`;
        }

        function renderSearchResults(data) {
            const q = data.query;
            const total = data.totals.topics + data.totals.comments + data.totals.users;

            if (total === 0) {
                searchResults.innerHTML = noticeBox(`"${q}" için sonuç bulunamadı.`);
                return;
            }

            let html = `<p class="hint"><strong class="text-ink-soft">${escapeHtml(q)}</strong> için ${total} sonuç</p>`;

            if (data.users.length) {
                html += `<section>${sectionHeader('users', 'Kullanıcılar', data.totals.users)}
                    <div class="grid gap-2 sm:grid-cols-2">` + data.users.map(u => `
                        <a href="profile.html?u=${escapeAttr(u.username)}" class="card card-hover p-3 flex items-center gap-3">
                            <span class="w-9 h-9 rounded-lg bg-accent/15 border border-accent/25 grid place-items-center shrink-0 overflow-hidden">
                                ${u.avatarUrl
                    ? `<img src="${escapeHtml(u.avatarUrl)}" alt="" class="w-full h-full object-cover">`
                    : `<span class="text-xs font-bold text-accent-soft">${escapeHtml(u.username.charAt(0).toUpperCase())}</span>`}
                            </span>
                            <span class="min-w-0">
                                <span class="flex items-center gap-1.5 flex-wrap">
                                    ${renderUserName(u.username, 'text-[13px]')}${renderBadge(u.username)}
                                </span>
                                <span class="block hint truncate mt-0.5">${highlight(truncate(u.bio || 'Biyografi yok.', 60), q)}</span>
                            </span>
                        </a>`).join('') + `</div></section>`;
            }

            if (data.topics.length) {
                html += `<section>${sectionHeader('file-text', 'Konular', data.totals.topics)}
                    <div class="space-y-2">` + data.topics.map(t => `
                        <a href="topic-detail.html?id=${t.id}" class="card card-hover p-4 block">
                            <div class="flex items-center gap-2 mb-1.5 text-xs">
                                <span class="chip chip-accent">${escapeHtml(t.categoryName)}</span>
                                <span class="text-ink-faint ml-auto">${escapeHtml(timeAgo(t.createdAt))}${t.updatedAt ? ' · düzenlendi' : ''}</span>
                            </div>
                            <h4 class="text-sm font-semibold text-ink mb-1">${highlight(t.title, q)}</h4>
                            <p class="text-[13px] text-ink-soft">${highlight(truncate(stripRichSyntax(t.content), 180), q)}</p>
                            <div class="flex items-center gap-2 mt-3 pt-3 divider text-xs">
                                ${renderUserName(t.authorUsername, 'text-[13px]')}${renderBadge(t.authorUsername)}
                                <span class="text-ink-faint ml-auto flex items-center gap-1">
                                    <i data-lucide="heart" class="w-3 h-3"></i>${t.likeCount}
                                </span>
                            </div>
                        </a>`).join('') + `</div></section>`;
            }

            if (data.comments.length) {
                html += `<section>${sectionHeader('message-square', 'Yanıtlar', data.totals.comments)}
                    <div class="space-y-2">` + data.comments.map(c => `
                        <a href="topic-detail.html?id=${c.topicId}" class="card card-hover p-4 block">
                            <div class="flex items-center gap-2 mb-1.5 text-xs flex-wrap">
                                ${renderUserName(c.authorUsername, 'text-[13px]')}${renderBadge(c.authorUsername)}
                                <span class="text-ink-faint ml-auto">${escapeHtml(timeAgo(c.createdAt))}${c.updatedAt ? ' · düzenlendi' : ''}</span>
                            </div>
                            <p class="text-[13px] text-ink-soft">${highlight(truncate(stripRichSyntax(c.content), 180), q)}</p>
                            <p class="hint mt-2.5 pt-2.5 divider flex items-center gap-1.5">
                                <i data-lucide="corner-down-right" class="w-3 h-3"></i>${escapeHtml(c.topicTitle)}
                            </p>
                        </a>`).join('') + `</div></section>`;
            }

            searchResults.innerHTML = html;
            lucide.createIcons();
        }

        // ── Başlangıç ───────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            renderHeader({ active: 'home' });
            await renderCategoryBar();
            await fetchTopics(0);

            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery) {
                searchInput.value = initialQuery;
                runSearch();
            }
        });
    </script>
</body>

</html>
