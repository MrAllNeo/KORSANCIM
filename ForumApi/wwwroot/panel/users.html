<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcılar — Panel — KORSANCIM</title>
    <link rel="icon" type="image/svg+xml" href="../static/favicon.svg">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/app.js"></script>
    <script src="panel.js"></script>
</head>

<body class="bg-base text-ink font-sans">

    <div id="panel-header"></div>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-4">

        <div>
            <h1 class="text-lg font-bold text-ink mb-1">Kullanıcılar</h1>
            <p class="hint">Ban/unban ve rol yönetimi.</p>
        </div>

        <input type="text" id="search-input" class="input" placeholder="Kullanıcı adı veya e-posta ara…">

        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-ink-faint text-xs border-b border-line">
                            <th class="p-3 font-medium">Kullanıcı</th>
                            <th class="p-3 font-medium">Rol</th>
                            <th class="p-3 font-medium">Rozet</th>
                            <th class="p-3 font-medium">Durum</th>
                            <th class="p-3 font-medium">Kayıt</th>
                            <th class="p-3 font-medium text-right">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="user-rows">
                        <tr>
                            <td colspan="6" class="p-6 text-center hint">Yükleniyor…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="pagination" class="flex justify-center gap-2"></div>
    </main>

    <div id="ban-modal" class="hidden fixed inset-0 z-50 bg-black/60 grid place-items-center p-4">
        <div class="card p-5 w-full max-w-sm">
            <h2 class="text-sm font-bold text-ink mb-3">Kullanıcıyı banla</h2>
            <label class="label" for="ban-reason">Sebep (isteğe bağlı)</label>
            <textarea id="ban-reason" rows="3" class="input" placeholder="Sebep yazabilirsiniz…"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeBanModal()" class="btn btn-quiet">Vazgeç</button>
                <button onclick="confirmBan()" class="btn btn-primary btn-danger">Banla</button>
            </div>
        </div>
    </div>

    <div id="role-confirm-modal" class="hidden fixed inset-0 z-50 bg-black/60 grid place-items-center p-4">
        <div class="card p-5 w-full max-w-sm">
            <h2 class="text-sm font-bold text-ink mb-3">Rol değişikliğini onayla</h2>
            <p class="hint mb-3">Rol atama en hassas işlemdir — devam etmek için şifreni doğrula.</p>
            <label class="label" for="role-confirm-password">Şifreniz</label>
            <input type="password" id="role-confirm-password" class="input" autocomplete="current-password">
            <p id="role-confirm-error" class="text-bad text-xs mt-2 hidden"></p>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeRoleConfirmModal(true)" class="btn btn-quiet">Vazgeç</button>
                <button onclick="confirmRoleChange()" class="btn btn-primary">Onayla</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let searchTerm = '';
        let banTargetId = null;
        let searchDebounce = null;

        const ROLE_BADGE_CLASS = {
            User: 'bg-sunken text-ink-soft border border-line',
            Moderator: 'bg-accent-dim text-accent-soft border border-accent/30',
            Admin: 'bg-accent/20 text-accent-soft border border-accent/40'
        };

        function roleBadge(role) {
            if (role === 'Owner') {
                return `<span class="tier-badge tier-shine tier-badge-gold text-[10px] px-2 py-0.5 rounded-md">Owner</span>`;
            }
            const cls = ROLE_BADGE_CLASS[role] || ROLE_BADGE_CLASS.User;
            return `<span class="text-[10px] px-2 py-0.5 rounded-md ${cls}">${escapeHtml(role)}</span>`;
        }

        function roleCell(user) {
            if (!isOwner() || user.role === 'Owner') return roleBadge(user.role);

            const roles = ['User', 'Moderator', 'Admin'];
            const options = roles.map(r => `<option value="${r}" ${r === user.role ? 'selected' : ''}>${r}</option>`).join('');
            return `<select data-user-id="${user.id}" data-previous-role="${user.role}" class="role-select input" style="padding:4px 8px;font-size:12px;width:auto;">${options}</select>`;
        }

        let badgeOptions = [];

        async function loadBadgeOptions() {
            const res = await apiFetch('/api/admin/badges');
            if (res.ok) badgeOptions = await res.json();
        }

        function badgeCell(user) {
            if (!isAdmin()) {
                return user.badge ? renderBadge(user.badge) : '<span class="hint">—</span>';
            }

            const options = ['<option value="">(rozet yok)</option>']
                .concat(badgeOptions.map(b =>
                    `<option value="${b.id}" ${user.badge && user.badge.id === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`))
                .join('');
            return `<select data-badge-user-id="${user.id}" class="badge-select input" style="padding:4px 8px;font-size:12px;width:auto;">${options}</select>`;
        }

        async function loadUsers(page = 1) {
            currentPage = page;
            const params = new URLSearchParams({ page, pageSize: 20 });
            if (searchTerm) params.set('search', searchTerm);

            const res = await apiFetch(`/api/admin/users?${params}`);
            if (!res.ok) return;

            const data = await res.json();

            document.getElementById('user-rows').innerHTML = data.items.length
                ? data.items.map(u => `
                    <tr class="border-b border-line last:border-0">
                        <td class="p-3">
                            <div class="font-medium text-ink">${escapeHtml(u.username)}</div>
                            <div class="hint">${escapeHtml(u.email)}</div>
                        </td>
                        <td class="p-3">${roleCell(u)}</td>
                        <td class="p-3">${badgeCell(u)}</td>
                        <td class="p-3">
                            ${u.isBanned
                        ? `<span class="text-[10px] px-2 py-0.5 rounded-md bg-bad/15 text-bad border border-bad/30">Banlı</span>`
                        : `<span class="text-[10px] px-2 py-0.5 rounded-md bg-ok/15 text-ok border border-ok/30">Aktif</span>`}
                        </td>
                        <td class="p-3 hint">${formatDate(u.createdAt)}</td>
                        <td class="p-3">
                            <div class="flex justify-end gap-1">
                                ${u.isBanned
                        ? `<button data-unban-id="${u.id}" class="btn btn-quiet btn-sm">Unban</button>`
                        : `<button data-ban-id="${u.id}" class="btn btn-quiet btn-sm btn-danger">Banla</button>`}
                                <a href="../profile.html?u=${escapeAttr(u.username)}" class="btn btn-quiet btn-sm">Profil</a>
                            </div>
                        </td>
                    </tr>`).join('')
                : `<tr><td colspan="6" class="p-6 text-center hint">Kullanıcı bulunamadı.</td></tr>`;

            document.querySelectorAll('[data-ban-id]').forEach(btn =>
                btn.addEventListener('click', () => openBanModal(Number(btn.dataset.banId))));
            document.querySelectorAll('[data-unban-id]').forEach(btn =>
                btn.addEventListener('click', () => unban(Number(btn.dataset.unbanId))));
            document.querySelectorAll('.role-select').forEach(sel =>
                sel.addEventListener('change', () => openRoleConfirmModal(sel)));
            document.querySelectorAll('.badge-select').forEach(sel =>
                sel.addEventListener('change', () => assignBadge(Number(sel.dataset.badgeUserId), sel.value)));

            renderPagination('pagination', data.page, data.totalPages, loadUsers);
        }

        function openBanModal(id) {
            banTargetId = id;
            document.getElementById('ban-reason').value = '';
            document.getElementById('ban-modal').classList.remove('hidden');
        }

        function closeBanModal() {
            banTargetId = null;
            document.getElementById('ban-modal').classList.add('hidden');
        }

        async function confirmBan() {
            const reason = document.getElementById('ban-reason').value;
            const res = await apiFetchJson(`/api/admin/users/${banTargetId}/ban`, 'POST', { reason });
            closeBanModal();
            if (res.ok) {
                loadUsers(currentPage);
            } else {
                alert(await readError(res, 'Banlanamadı.'));
            }
        }

        async function unban(id) {
            const res = await apiFetch(`/api/admin/users/${id}/unban`, { method: 'POST' });
            if (res.ok) {
                loadUsers(currentPage);
            } else {
                alert(await readError(res, 'Ban kaldırılamadı.'));
            }
        }

        let roleConfirmTarget = null; // { id, role, selectEl }

        function openRoleConfirmModal(selectEl) {
            roleConfirmTarget = {
                id: Number(selectEl.dataset.userId),
                role: selectEl.value,
                selectEl
            };
            document.getElementById('role-confirm-password').value = '';
            document.getElementById('role-confirm-error').classList.add('hidden');
            document.getElementById('role-confirm-modal').classList.remove('hidden');
        }

        // revert: vazgeçilince select eski değerine döner.
        function closeRoleConfirmModal(revert) {
            if (revert && roleConfirmTarget) {
                roleConfirmTarget.selectEl.value = roleConfirmTarget.selectEl.dataset.previousRole;
            }
            roleConfirmTarget = null;
            document.getElementById('role-confirm-modal').classList.add('hidden');
        }

        async function confirmRoleChange() {
            const password = document.getElementById('role-confirm-password').value;
            const errorEl = document.getElementById('role-confirm-error');
            const { id, role, selectEl } = roleConfirmTarget;

            const res = await apiFetchJson(`/api/admin/users/${id}/role`, 'PUT', { role, currentPassword: password });

            if (res.ok) {
                selectEl.dataset.previousRole = role;
                closeRoleConfirmModal(false);
                loadUsers(currentPage);
            } else {
                errorEl.textContent = await readError(res, 'Rol değiştirilemedi.');
                errorEl.classList.remove('hidden');
            }
        }

        async function assignBadge(id, badgeId) {
            const res = await apiFetchJson(`/api/admin/users/${id}/badge`, 'PUT', { badgeId: badgeId ? Number(badgeId) : null });
            if (!res.ok) {
                alert(await readError(res, 'Rozet güncellenemedi.'));
            }
            loadUsers(currentPage);
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                searchTerm = e.target.value.trim();
                loadUsers(1);
            }, 300);
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireStaff()) return;
            renderPanelNav('users');
            if (isAdmin()) await loadBadgeOptions();
            loadUsers();
        });
    </script>
</body>

</html>
