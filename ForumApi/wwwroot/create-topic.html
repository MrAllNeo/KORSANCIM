<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Konu — KORSANCIM</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236366f1'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'>K</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</head>

<body class="bg-base text-ink font-sans">

    <div id="site-header"></div>

    <main class="max-w-3xl mx-auto px-4 py-6">

        <a href="index.html" class="btn btn-quiet -ml-3 mb-3">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Vazgeç
        </a>

        <div class="card p-6">
            <h1 class="text-base font-bold text-ink mb-1">Yeni konu aç</h1>
            <p class="hint mb-6">Sorunu veya paylaşmak istediğini topluluğa anlat.</p>

            <form id="create-topic-form" class="space-y-5">

                <div>
                    <div class="flex items-baseline gap-3 mb-1.5">
                        <label class="label mb-0" for="topic-title">Başlık</label>
                        <span id="title-counter" class="hint ml-auto"></span>
                    </div>
                    <input type="text" id="topic-title" required minlength="3" maxlength="200" class="input"
                        placeholder="Kısa ve açıklayıcı bir başlık">
                </div>

                <div>
                    <label class="label" for="topic-category">Kategori</label>
                    <select id="topic-category" required class="input">
                        <option value="" disabled selected>Yükleniyor…</option>
                    </select>
                </div>

                <div>
                    <div class="flex items-baseline gap-3 mb-1.5">
                        <label class="label mb-0" for="topic-content">İçerik</label>
                        <span id="content-counter" class="hint ml-auto"></span>
                    </div>
                    <textarea id="topic-content" rows="9" required maxlength="20000" class="input"
                        placeholder="Detayları buraya yaz…"></textarea>
                </div>

                <div>
                    <label class="label">Görseller <span class="text-ink-faint font-normal">(isteğe bağlı)</span></label>
                    <label
                        class="relative flex flex-col items-center justify-center gap-2 border border-dashed border-line hover:border-line-strong rounded-lg py-7 px-4 text-center cursor-pointer transition bg-sunken">
                        <input type="file" id="topic-files" multiple accept="image/jpeg,image/png,image/gif,image/webp"
                            class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
                        <i data-lucide="image-plus" class="w-6 h-6 text-ink-faint"></i>
                        <span class="text-[13px] text-ink-soft">Görsel seçmek için tıkla</span>
                        <span class="hint">JPG, PNG, GIF, WEBP · en fazla 5 dosya · dosya başına 5 MB</span>
                    </label>
                    <div id="file-list" class="mt-2 space-y-1.5"></div>
                </div>

                <label
                    class="flex items-start gap-3 p-4 rounded-lg border border-line bg-sunken cursor-pointer select-none">
                    <input type="checkbox" id="legal-terms" required
                        class="mt-0.5 w-4 h-4 rounded accent-accent shrink-0 cursor-pointer">
                    <span class="text-[13px] text-ink-soft leading-relaxed">
                        <strong class="text-ink block mb-0.5">Topluluk kuralları ve sorumluluk reddi</strong>
                        Paylaştığım içeriğin tüm yasal sorumluluğunun bana ait olduğunu; illegal faaliyet, çocuk
                        istismarı, ırkçılık, dini veya kültürel değerleri aşağılayan ya da ayrımcılık içeren öge
                        barındırmadığını beyan ederim.
                    </span>
                </label>

                <div id="error-message" class="hidden alert alert-bad"></div>

                <div class="flex justify-end gap-2 pt-1">
                    <a href="index.html" class="btn btn-quiet">İptal</a>
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <i data-lucide="send" class="w-4 h-4"></i> Konuyu Yayınla
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto px-4 py-8 text-center">
        <p class="hint">KORSANCIM · anonim topluluk forumu</p>
    </footer>

    <script>
        const MAX_FILES = 5;
        const MAX_BYTES = 5 * 1024 * 1024;
        let selectedFiles = [];

        function handleFileSelect(event) {
            const list = document.getElementById('file-list');
            const errorBox = document.getElementById('error-message');
            errorBox.classList.add('hidden');

            selectedFiles = Array.from(event.target.files).filter(f => f.size > 0);

            // Sunucu da doğruluyor; buradaki kontrol yalnızca erken geri bildirim.
            if (selectedFiles.length > MAX_FILES) {
                showError(`En fazla ${MAX_FILES} dosya seçebilirsin.`);
                selectedFiles = selectedFiles.slice(0, MAX_FILES);
            }

            const tooBig = selectedFiles.find(f => f.size > MAX_BYTES);
            if (tooBig) {
                showError(`"${tooBig.name}" 5 MB sınırını aşıyor.`);
                selectedFiles = selectedFiles.filter(f => f.size <= MAX_BYTES);
            }

            list.innerHTML = selectedFiles.map(file => `
                <div class="flex items-center gap-2 px-3 py-2 rounded-lg border border-line bg-sunken text-xs">
                    <i data-lucide="image" class="w-3.5 h-3.5 text-ink-faint shrink-0"></i>
                    <span class="text-ink-soft truncate">${escapeHtml(file.name)}</span>
                    <span class="hint ml-auto shrink-0">${(file.size / (1024 * 1024)).toFixed(2)} MB</span>
                </div>`).join('');

            lucide.createIcons();
        }

        function showError(message) {
            const box = document.getElementById('error-message');
            box.textContent = message;
            box.classList.remove('hidden');
        }

        async function loadCategoryOptions() {
            const categories = await getCategories();
            const select = document.getElementById('topic-category');
            select.innerHTML = `<option value="" disabled selected>Bir kategori seç</option>` +
                categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        }

        document.getElementById('create-topic-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-message');
            errorBox.classList.add('hidden');

            const formData = new FormData();
            formData.append('title', document.getElementById('topic-title').value);
            formData.append('categoryId', document.getElementById('topic-category').value);
            formData.append('content', document.getElementById('topic-content').value);
            formData.append('isLegalTermsAccepted', document.getElementById('legal-terms').checked);
            selectedFiles.forEach(file => formData.append('files', file));

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Gönderiliyor…`;
            lucide.createIcons();

            try {
                // Content-Type verilmiyor; tarayıcı multipart sınırını kendi ekler.
                const response = await apiFetch('/api/topics', { method: 'POST', body: formData });

                if (response.ok) {
                    const topic = await response.json();
                    window.location.href = `topic-detail.html?id=${topic.id}`;
                } else {
                    showError(await readError(response, 'Konu gönderilemedi.'));
                }
            } catch (error) {
                console.error('Bağlantı hatası:', error);
                showError('Sunucuya bağlanılamadı.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Konuyu Yayınla`;
                lucide.createIcons();
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireLogin()) return;
            renderHeader({ active: 'new' });
            attachCounter('topic-title', 'title-counter', 200);
            attachCounter('topic-content', 'content-counter', 20000);
            await loadCategoryOptions();
            lucide.createIcons();
        });
    </script>
</body>

</html>
