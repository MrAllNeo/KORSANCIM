<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Yeşil Neon Parlama Efekti -->
    <filter id="hacker-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Terminal Yeşil Gradyanı -->
    <linearGradient id="matrixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00B341" />
    </linearGradient>
  </defs>

  <!-- Arka Plan: Mat Derin Siyah / Kömür (#0a0c10) -->
  <rect width="512" height="512" rx="96" fill="#0a0c10"/>

  <!-- Dış İnce İnce Çerçeve (Terminal Pencereleri Gibi) -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Terminal Butonları (Kırmızı, Sarı, Yeşil Noktalar) -->
  <circle cx="72" cy="64" r="8" fill="#ef4444" opacity="0.7"/>
  <circle cx="96" cy="64" r="8" fill="#f59e0b" opacity="0.7"/>
  <circle cx="120" cy="64" r="8" fill="#10b981" opacity="0.7"/>

  <!-- K Harfi & Command Prompt (>_) Tasarımı -->
  <!-- Dikey Kod Bloğu Satırı -->
  <path d="M 150 140 H 195 V 372 H 150 Z" fill="url(#matrixGreen)" filter="url(#hacker-glow)"/>

  <!-- Terminal Ok İmleci (Üst Bacak) -->
  <path d="M 215 240 L 325 140 H 380 L 255 265 Z" fill="url(#matrixGreen)" filter="url(#hacker-glow)"/>

  <!-- Terminal Ok İmleci (Alt Bacak) -->
  <path d="M 255 245 L 380 372 H 325 L 215 270 Z" fill="url(#matrixGreen)" filter="url(#hacker-glow)"/>

  <!-- Yanıp Sönen Terminal Yan Çizgisi (Cursor _) -->
  <rect x="340" y="340" width="32" height="32" fill="#00FF66" filter="url(#hacker-glow)" opacity="0.85"/>
</svg>
