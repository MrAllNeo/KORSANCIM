<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — KORSANCIM</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</head>

<body class="bg-base text-ink font-sans min-h-screen grid place-items-center px-4 py-10">

    <div class="w-full max-w-sm">

        <a href="index.html" class="flex items-center justify-center gap-2.5 mb-8">
            <img src="static/favicon.svg" alt="KORSANCIM" class="w-9 h-9 rounded-lg">
            <span class="font-bold text-lg tracking-tight">KORSANCIM</span>
        </a>

        <div class="card p-6">

            <div class="flex gap-1 p-1 rounded-lg bg-sunken border border-line mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="tab flex-1"
                    aria-selected="true">Giriş Yap</button>
                <button id="tab-register" onclick="switchTab('register')" class="tab flex-1"
                    aria-selected="false">Kayıt Ol</button>
            </div>

            <!-- GİRİŞ -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="label" for="login-user">Kullanıcı adı veya e-posta</label>
                    <input type="text" id="login-user" required autocomplete="username" class="input">
                </div>
                <div>
                    <label class="label" for="login-pass">Şifre</label>
                    <div class="relative">
                        <input type="password" id="login-pass" required autocomplete="current-password"
                            class="input pr-10">
                        <button type="button" onclick="togglePassword('login-pass', this)"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-ink-faint hover:text-ink transition p-1.5"
                            aria-label="Şifreyi göster">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-full">Oturum Aç</button>
            </form>

            <!-- KAYIT -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="label" for="reg-user">Kullanıcı adı</label>
                    <input type="text" id="reg-user" required autocomplete="username" minlength="3" maxlength="32"
                        pattern="[a-zA-Z0-9_.\-]+" class="input" placeholder="PardusGamer">
                    <p class="hint mt-1.5">3-32 karakter · harf, rakam ve _ . -</p>
                </div>
                <div>
                    <label class="label" for="reg-email">E-posta</label>
                    <input type="email" id="reg-email" required autocomplete="email" class="input"
                        placeholder="ornek@korsancim.com">
                </div>
                <div>
                    <label class="label" for="reg-pass">Şifre</label>
                    <div class="relative">
                        <input type="password" id="reg-pass" required autocomplete="new-password" minlength="8"
                            class="input pr-10">
                        <button type="button" onclick="togglePassword('reg-pass', this)"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-ink-faint hover:text-ink transition p-1.5"
                            aria-label="Şifreyi göster">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="hint mt-1.5">En az 8 karakter</p>
                </div>
                <button type="submit" class="btn btn-primary w-full">Hesap Oluştur</button>
            </form>

            <div id="auth-alert" class="hidden alert mt-4 text-center"></div>
        </div>

        <p class="hint text-center mt-6">
            <a href="index.html" class="hover:text-ink-soft transition">← Foruma dön</a>
        </p>
    </div>

    <script>
        const API_BASE = '/api/auth';

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('register-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').setAttribute('aria-selected', isLogin);
            document.getElementById('tab-register').setAttribute('aria-selected', !isLogin);
            document.getElementById('auth-alert').classList.add('hidden');
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
            btn.setAttribute('aria-label', show ? 'Şifreyi gizle' : 'Şifreyi göster');
            lucide.createIcons();
        }

        function showAlert(message, ok = false) {
            const box = document.getElementById('auth-alert');
            box.textContent = message;
            box.className = `alert mt-4 text-center ${ok ? 'alert-ok' : 'alert-bad'}`;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: document.getElementById('login-user').value,
                        password: document.getElementById('login-pass').value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    saveSession(data);
                    showAlert('Giriş başarılı, yönlendiriliyorsun…', true);
                    setTimeout(() => window.location.href = 'index.html', 600);
                } else {
                    showAlert(data.error || 'Giriş yapılamadı.');
                    btn.disabled = false;
                }
            } catch {
                showAlert('Sunucuya bağlanılamadı.');
                btn.disabled = false;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reg-user').value,
                        email: document.getElementById('reg-email').value,
                        password: document.getElementById('reg-pass').value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    showAlert(data.message || 'Kayıt başarılı! Şimdi giriş yapabilirsin.', true);
                    switchTab('login');
                } else {
                    showAlert(data.error || 'Kayıt olunamadı.');
                }
            } catch {
                showAlert('Sunucuya bağlanılamadı.');
            } finally {
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</body>

</html>
